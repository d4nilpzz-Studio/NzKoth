name: NzKoth
version: '${version}'

main: dev.d4nilpzz.nzKoth.NzKoth
api-version: '1.21'
load: POSTWORLD

softdepend: [ PlaceholderAPI ]

libraries:
  - com.zaxxer:HikariCP:${hikari.version}
  - com.mysql:mysql-connector-j:${mysql.version}
  - org.postgresql:postgresql:${postgresql.version}

permissions:
  nzkoth.admin:
    description: Full access to NzKoth commands
    default: op

authors: [ d4nilpzz ]
website: https://github.com/d4nilpzz
